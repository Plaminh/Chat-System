spring.application.name=chat-server
spring.main.web-application-type=none

# Configuration sources (a later entry overrides an earlier one):
#   1. ./server.properties, or the file given by -Dchat.server.config
#      -> the configuration file shipped in release/ for running the jars
#   2. ../.env and ./.env
#      -> the developer .env at the repository root, shared with Docker Compose
# When a repository .env exists it wins, so developers only edit .env.
# All files use the same keys: POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB,
# POSTGRES_USER, POSTGRES_PASSWORD, CHAT_SERVER_PORT.
spring.config.import=optional:file:${chat.server.config:./server.properties},optional:file:../.env[.properties],optional:file:./.env[.properties]

chat.server.port=${CHAT_SERVER_PORT:5050}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:chat_system}
spring.datasource.username=${POSTGRES_USER:chat_app}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
