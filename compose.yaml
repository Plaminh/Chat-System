services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-system-v1-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - chat-system-v1-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Required}
      PGDATABASE: ${POSTGRES_DB:?Required}
    volumes:
      - ./script:/sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        table_count=$$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
          "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
        if [ "$$table_count" = "0" ]; then
          echo "Initializing Chat System schema and development seed data..."
          if ! psql -X -v ON_ERROR_STOP=1 -f /sql/schema.sql; then
            echo "Database schema creation failed; development seed was not attempted." >&2
            exit 1
          fi
          if ! psql -X -v ON_ERROR_STOP=1 -f /sql/seed.sql; then
            echo "Development seed loading failed. The schema remains initialized and the seed transaction left no partial fixture rows." >&2
            echo "After correcting the cause, rerun script/seed.sql manually only if every application table is still empty." >&2
            exit 1
          fi
        else
          echo "Database public schema already contains $$table_count table(s); automatic initialization was skipped without compatibility validation."
          echo "Older or incomplete development schemas require separate manual review; no upgrade, repair, or seed was attempted."
        fi
        echo "Database initialization step completed."
    restart: "no"

volumes:
  chat-system-v1-data:
    external: true
    name: chat-system-v1-data
